
services:
  cass:
    build:
      context: .
      dockerfile: docker/standalone/node/Dockerfile
    networks:
      - esnet
    expose:
      - "80"
    environment:
      CASS_LOOPBACK: "http://cass/api/"
      CASS_LOOPBACK_PROXY: "https://cass.vps-yma.ovh/api/"
      ELASTICSEARCH_ENDPOINT: "http://elasticsearch-cass:9200"
      PORT: "80"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    user: "1000"
    volumes:
      - etc:/app/etc
    depends_on:
      elasticsearch-cass:
        condition: service_started
    restart: unless-stopped

  elasticsearch-cass:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    networks:
      - esnet
    environment:
      bootstrap.memory_lock: "true"
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata1:/usr/share/elasticsearch/data
    restart: unless-stopped

volumes:
  etc:
  esdata1:

networks:
  esnet:
    driver: bridge
